# ============================================
# Study Clash Nginx 反向代理配置
# 适用于 Docker + Nginx 联合部署
# ============================================

upstream studyclash {
    server app:5002;
    keepalive 64;
}

server {
    listen 80;
    server_name localhost;

    # 如需 HTTPS，取消下方注释并配置 SSL 证书
    # listen 443 ssl http2;
    # ssl_certificate /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/key.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    # 客户端最大上传大小（与 Flask MAX_CONTENT_LENGTH=16MB 对应）
    client_max_body_size 16M;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态文件直接由 Nginx 提供（性能更优）
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # WebSocket 代理（Socket.IO 路径）
    location /socket.io/ {
        proxy_pass http://studyclash/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 应用请求代理
    location / {
        proxy_pass http://studyclash;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# HTTP 到 HTTPS 重定向（启用 HTTPS 时取消注释）
