{% extends "base.html" %}

{% block title %}页面未找到 - Study Clash{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="mb-4">
                <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
            </div>
            <h1 class="display-5 fw-bold mb-3">404</h1>
            <h4 class="text-muted mb-4">页面未找到</h4>
            <p class="text-secondary mb-4">抱歉，您访问的页面不存在或已被移除。</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                    <i class="bi bi-house"></i> 返回首页
                </a>
                {% if current_user.is_authenticated and current_user.is_admin %}
                <a href="{{ url_for('admin.index') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-speedometer2"></i> 管理后台
                </a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
