{% extends "base.html" %}

{% block title %}修改密码 - Study Clash{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h5 class="mb-0"><i class="bi bi-shield-lock"></i> 修改密码</h5>
            </div>
            <div class="card-body">
                {% if current_user.must_change_password %}
                <div class="alert alert-warning">
                    <i class="bi bi-exclamation-triangle"></i> 这是您的默认密码，请立即修改以确保账户安全。
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('auth.change_password') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="mb-3">
                        <label class="form-label">原密码</label>
                        <input type="password" class="form-control" name="old_password" required 
                               {% if current_user.must_change_password %}value="admin123" readonly{% endif %}>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">新密码</label>
                        <input type="password" class="form-control" name="new_password" required 
                               minlength="8" placeholder="至少8位，包含大小写字母、数字和特殊字符">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">确认新密码</label>
                        <input type="password" class="form-control" name="confirm_password" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-key"></i> 修改密码
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
