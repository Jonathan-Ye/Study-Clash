{% extends "base.html" %}

{% block title %}登录 - Study Clash{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0"><i class="bi bi-box-arrow-in-right"></i> 用户登录</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名/邮箱</label>
                        <input type="text" class="form-control" id="username" name="username" 
                               placeholder="请输入用户名或邮箱" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="请输入密码" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">记住我</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> 登录
                    </button>
                </form>
                {% if site_info.registration_enabled %}
                <hr>
                <p class="text-center text-muted mb-0">
                    还没有账号？ <a href="{{ url_for('auth.register') }}">立即注册</a>
                </p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
