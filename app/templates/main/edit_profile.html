{% extends "base.html" %}

{% block title %}编辑资料 - Study Clash{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-pencil"></i> 编辑资料</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">邮箱</label>
                            <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
                        </div>
                    </div>
                    
                    <hr>
                    <h6 class="mb-3">基本信息</h6>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">昵称</label>
                            <input type="text" class="form-control" name="nickname" 
                                   value="{{ current_user.nickname or '' }}" placeholder="请输入昵称">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">姓名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="real_name" 
                                   value="{{ current_user.real_name or '' }}" placeholder="请输入真实姓名" disabled>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">学号 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="student_id" 
                                   value="{{ current_user.student_id or '' }}" placeholder="请输入学号" disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">手机号码</label>
                            <input type="tel" class="form-control" name="phone" 
                                   value="{{ current_user.phone or '' }}" placeholder="请输入手机号码">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">生日</label>
                            <input type="date" class="form-control" name="birthday" 
                                   value="{{ current_user.birthday.strftime('%Y-%m-%d') if current_user.birthday else '' }}">
                        </div>
                    </div>
                    
                    <hr>
                    <h6 class="mb-3">学校信息</h6>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">学校</label>
                            <input type="text" class="form-control" name="school" 
                                   value="{{ current_user.school or '' }}" placeholder="请输入学校名称" disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">年级</label>
                            <select class="form-select" name="grade" disabled>
                                <option value="">请选择年级</option>
                                <option value="高一" {{ 'selected' if current_user.grade == '高一' }}>高一</option>
                                <option value="高二" {{ 'selected' if current_user.grade == '高二' }}>高二</option>
                                <option value="高三" {{ 'selected' if current_user.grade == '高三' }}>高三</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">专业</label>
                            <input type="text" class="form-control" name="major" 
                                   value="{{ current_user.major or '' }}" placeholder="请输入专业（文科/理科）" disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">班级</label>
                            <input type="text" class="form-control" name="class_name" 
                                   value="{{ current_user.class_name or '' }}" placeholder="请输入班级" disabled>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('main.profile') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> 返回
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check"></i> 保存
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
