{% extends 'admin/base.html' %}

{% block title %}编辑章节{% endblock %}

{% block admin_content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0"><i class="bi bi-pencil"></i> 编辑章节</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="subject_id" class="form-label">所属学科 <span class="text-danger">*</span></label>
                            <select name="subject_id" id="subject_id" class="form-select" required>
                                {% for subject in subjects %}
                                <option value="{{ subject.id }}" {{ 'selected' if chapter.subject_id == subject.id }}>
                                    {{ subject.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="parent_id" class="form-label">上级章节</label>
                            <select name="parent_id" id="parent_id" class="form-select">
                                <option value="">一级章节（最高级别）</option>
                                {% for c in all_chapters if c.level < 3 and c.id != chapter.id %}
                                <option value="{{ c.id }}" {{ 'selected' if chapter.parent_id == c.id }}>
                                    {{ '>' if c.level > 1 else '' }}{{ c.name }}
                                </option>
                                {% endfor %}
                            </select>
                            <small class="text-muted">当前级别: {{ chapter.get_level_name() }} ({{ chapter.level }}级)</small>
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">章节名称 <span class="text-danger">*</span></label>
                            <input type="text" name="name" id="name" class="form-control" value="{{ chapter.name }}" required>
                        </div>
                        <input type="hidden" name="order" id="order" value="{{ chapter.order }}">
                        <div class="mb-3">
                            <label for="description" class="form-label">描述</label>
                            <textarea name="description" id="description" class="form-control" rows="3">{{ chapter.description or '' }}</textarea>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" name="is_active" id="is_active" class="form-check-input" {{ 'checked' if chapter.is_active }}>
                            <label class="form-check-label" for="is_active">启用</label>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> 保存
                            </button>
                            <a href="{{ url_for('admin.chapters', subject_id=chapter.subject_id) }}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-lg"></i> 取消
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
