{% extends 'admin/base.html' %}

{% block title %}学生画像{% endblock %}

{% block admin_content %}
<div class="container-fluid py-4">
    <!-- 面包屑导航 -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
                <a href="{{ url_for('admin.index') }}" class="text-decoration-none">
                    <i class="bi bi-house-door"></i> 管理后台
                </a>
            </li>
            <li class="breadcrumb-item">
                <a href="{{ url_for('admin.student_analysis') }}" class="text-decoration-none">学生分析</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">学生画像</li>
        </ol>
    </nav>

    <!-- 基础信息卡片 -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-body" id="basicInfoCard">
                    <div class="text-center text-muted py-3">
                        <i class="bi bi-arrow-repeat"></i> 加载中...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 答题分析 + 错题分析 -->
    <div class="row g-4 mb-4">
        <!-- 答题分析区 -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0"><i class="bi bi-journal-check"></i> 答题分析</h5>
                </div>
                <div class="card-body">
                    <div class="row g-2 mb-3" id="answerStatsCards"></div>
                    <div style="height:200px;"><canvas id="subjectAccuracyChart"></canvas></div>
                </div>
            </div>
        </div>
        <!-- 错题分析区 -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0"><i class="bi bi-x-circle"></i> 错题分析</h5>
                </div>
                <div class="card-body">
                    <div class="row g-2 mb-3" id="wrongStatsCards"></div>
                    <div id="weakPointsList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 游戏表现 + 积分趋势 -->
    <div class="row g-4 mb-4">
        <!-- 游戏表现区 -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0"><i class="bi bi-controller"></i> 游戏表现</h5>
                </div>
                <div class="card-body">
                    <div class="row g-2 mb-3" id="gameStatsCards"></div>
                    <div style="height:200px;"><canvas id="gameTypeChart"></canvas></div>
                </div>
            </div>
        </div>
        <!-- 积分趋势区 -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0"><i class="bi bi-graph-up-arrow"></i> 积分趋势（近30天）</h5>
                </div>
                <div class="card-body">
                    <div style="height:200px;"><canvas id="pointsTrendChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
{{ super() }}
<script>
(function() {
    const userId = {{ user_id }};
    let subjectChart = null;
    let gameTypeChart = null;
    let pointsChart = null;

    function loadProfile() {
        fetch('/admin/api/student-analysis/student/' + userId + '/profile?time_range=30d')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                renderBasicInfo(data.basic_info, data.tier_info);
                renderAnswerStats(data.answer_stats);
                renderWrongStats(data.wrong_question_stats);
                renderGameStats(data.game_stats);
                renderPointsTrend(data.points_trend);
            })
            .catch(function() {
                document.getElementById('basicInfoCard').innerHTML = '<div class="text-center text-danger py-3"><i class="bi bi-exclamation-triangle"></i> 数据加载失败</div>';
            });
    }

    function renderBasicInfo(info, tier) {
        let html = '<div class="row align-items-center">';
        html += '<div class="col-md-8">';
        html += '<h4 class="mb-1">' + info.name + '</h4>';
        html += '<div class="row g-3 mt-2">';
        html += '<div class="col-sm-4"><small class="text-muted">学号</small><div>' + info.student_id + '</div></div>';
        html += '<div class="col-sm-4"><small class="text-muted">班级</small><div>' + info.class_name + '</div></div>';
        html += '<div class="col-sm-4"><small class="text-muted">专业</small><div>' + info.major + '</div></div>';
        html += '<div class="col-sm-4"><small class="text-muted">学校</small><div>' + info.school + '</div></div>';
        html += '<div class="col-sm-4"><small class="text-muted">注册时间</small><div>' + info.registered_at + '</div></div>';
        html += '<div class="col-sm-4"><small class="text-muted">最近登录</small><div>' + info.last_login + '</div></div>';
        html += '</div></div>';

        // 段位信息
        html += '<div class="col-md-4 text-center">';
        const tierIcon = tier.current.icon;
        if (tierIcon && tierIcon.endsWith('.svg')) {
            html += '<div class="mb-2"><img src="/static/images/tiers/' + tierIcon + '" alt="' + tier.current.name + '" style="width:64px;height:64px;"></div>';
        } else if (tierIcon) {
            html += '<div class="mb-2"><span style="font-size:2rem;">' + tierIcon + '</span></div>';
        } else {
            html += '<div class="mb-2"><i class="bi bi-shield" style="font-size:2rem;"></i></div>';
        }
        html += '<div class="fw-bold">' + tier.current.name + '</div>';
        const peakIcon = tier.peak.icon;
        let peakDisplay = tier.peak.name;
        if (peakIcon && peakIcon.endsWith('.svg')) {
            peakDisplay = '<img src="/static/images/tiers/' + peakIcon + '" alt="' + tier.peak.name + '" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;">' + tier.peak.name;
        }
        html += '<div class="text-muted small">最高段位：' + peakDisplay + '</div>';
        html += '<div class="text-muted small">连续学习：' + tier.streak_days + ' 天</div>';
        html += '</div>';

        html += '</div>';
        document.getElementById('basicInfoCard').innerHTML = html;
    }

    function renderAnswerStats(stats) {
        const accuracyDisplay = stats.accuracy !== null ? stats.accuracy + '%' : '--';
        let html = '';
        html += '<div class="col-3"><div class="text-center p-2 bg-light rounded"><small class="text-muted d-block">总答题数</small><span class="fw-bold fs-5">' + stats.total + '</span></div></div>';
        html += '<div class="col-3"><div class="text-center p-2 bg-light rounded"><small class="text-muted d-block">正确数</small><span class="fw-bold fs-5 text-success">' + stats.correct + '</span></div></div>';
        html += '<div class="col-3"><div class="text-center p-2 bg-light rounded"><small class="text-muted d-block">错误数</small><span class="fw-bold fs-5 text-danger">' + stats.wrong + '</span></div></div>';
        html += '<div class="col-3"><div class="text-center p-2 bg-light rounded"><small class="text-muted d-block">正确率</small><span class="fw-bold fs-5 text-primary">' + accuracyDisplay + '</span></div></div>';
        document.getElementById('answerStatsCards').innerHTML = html;

        // 按学科正确率柱状图
        const chartEl = document.getElementById('subjectAccuracyChart');
        if (stats.by_subject && stats.by_subject.length > 0) {
            const ctx = chartEl.getContext('2d');
            const labels = stats.by_subject.map(function(s) { return s.subject; });
            const values = stats.by_subject.map(function(s) { return s.accuracy; });

            if (subjectChart) subjectChart.destroy();
            subjectChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '正确率(%)',
                        data: values,
                        backgroundColor: 'rgba(54, 162, 235, 0.7)',
                        borderColor: 'rgb(54, 162, 235)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, max: 100 } }
                }
            });
        } else {
            chartEl.style.display = 'none';
            chartEl.parentElement.insertAdjacentHTML('beforeend', '<p class="text-muted text-center">暂无答题记录</p>');
        }
    }

    function renderWrongStats(stats) {
        let html = '';
        html += '<div class="col-4"><div class="text-center p-2 bg-light rounded"><small class="text-muted d-block">总错题数</small><span class="fw-bold fs-5">' + stats.total + '</span></div></div>';
        html += '<div class="col-4"><div class="text-center p-2 bg-light rounded"><small class="text-muted d-block">已掌握</small><span class="fw-bold fs-5 text-success">' + stats.mastered + '</span></div></div>';
        html += '<div class="col-4"><div class="text-center p-2 bg-light rounded"><small class="text-muted d-block">未掌握</small><span class="fw-bold fs-5 text-danger">' + stats.not_mastered + '</span></div></div>';
        document.getElementById('wrongStatsCards').innerHTML = html;

        // 薄弱知识点
        if (stats.weak_points && stats.weak_points.length > 0) {
            let wpHtml = '<h6 class="mt-3 mb-2"><i class="bi bi-exclamation-diamond"></i> 薄弱知识点 Top5</h6>';
            wpHtml += '<div class="list-group">';
            stats.weak_points.forEach(function(wp, idx) {
                wpHtml += '<div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">';
                wpHtml += '<span><span class="badge bg-secondary me-2">' + (idx + 1) + '</span>' + wp.chapter + ' <small class="text-muted">(' + wp.subject + ')</small></span>';
                wpHtml += '<span class="badge bg-danger">' + wp.wrong_count + ' 题</span>';
                wpHtml += '</div>';
            });
            wpHtml += '</div>';
            document.getElementById('weakPointsList').innerHTML = wpHtml;
        } else if (stats.total === 0) {
            document.getElementById('weakPointsList').innerHTML = '<p class="text-success text-center mt-3"><i class="bi bi-emoji-smile"></i> 暂无错题记录，表现优秀！</p>';
        } else {
            document.getElementById('weakPointsList').innerHTML = '<p class="text-muted text-center mt-3">暂无薄弱知识点数据</p>';
        }
    }

    function renderGameStats(stats) {
        const winRateDisplay = stats.win_rate !== null ? stats.win_rate + '%' : '--';
        let html = '';
        html += '<div class="col-4"><div class="text-center p-2 bg-light rounded"><small class="text-muted d-block">总场次</small><span class="fw-bold fs-5">' + stats.total + '</span></div></div>';
        html += '<div class="col-4"><div class="text-center p-2 bg-light rounded"><small class="text-muted d-block">胜场</small><span class="fw-bold fs-5 text-success">' + stats.won + '</span></div></div>';
        html += '<div class="col-4"><div class="text-center p-2 bg-light rounded"><small class="text-muted d-block">胜率</small><span class="fw-bold fs-5 text-primary">' + winRateDisplay + '</span></div></div>';
        document.getElementById('gameStatsCards').innerHTML = html;

        // 按游戏类型饼图
        const chartEl = document.getElementById('gameTypeChart');
        if (stats.by_type && stats.by_type.length > 0) {
            const ctx = chartEl.getContext('2d');
            const labels = stats.by_type.map(function(t) { return t.label; });
            const values = stats.by_type.map(function(t) { return t.count; });
            const colors = ['rgba(54, 162, 235, 0.7)', 'rgba(255, 99, 132, 0.7)', 'rgba(75, 192, 192, 0.7)'];

            if (gameTypeChart) gameTypeChart.destroy();
            gameTypeChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors.slice(0, labels.length)
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        } else {
            chartEl.style.display = 'none';
            chartEl.parentElement.insertAdjacentHTML('beforeend', '<p class="text-muted text-center">暂无游戏记录</p>');
        }
    }

    function renderPointsTrend(trend) {
        const chartEl = document.getElementById('pointsTrendChart');
        if (trend && trend.length > 0) {
            const ctx = chartEl.getContext('2d');
            const labels = trend.map(function(t) { return t.date.substring(5); }); // MM-DD
            const values = trend.map(function(t) { return t.points; });

            if (pointsChart) pointsChart.destroy();
            pointsChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '每日积分增量',
                        data: values,
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        } else {
            chartEl.style.display = 'none';
            chartEl.parentElement.insertAdjacentHTML('beforeend', '<p class="text-muted text-center">暂无积分数据</p>');
        }
    }

    // 初始加载
    loadProfile();
})();
</script>
{% endblock %}
