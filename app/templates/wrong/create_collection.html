{% extends "base.html" %}

{% block title %}新建收藏夹 - Study Clash{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-folder-plus"></i> 新建收藏夹</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">收藏夹名称</label>
                        <input type="text" class="form-control" name="name" required placeholder="例如：数学错题集">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">描述（可选）</label>
                        <textarea class="form-control" name="description" rows="3" placeholder="添加收藏夹描述..."></textarea>
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="is_public" id="is_public">
                            <label class="form-check-label" for="is_public">
                                <i class="bi bi-globe"></i> 公开收藏夹
                            </label>
                            <div class="form-text">公开后其他用户可以查看此收藏夹</div>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check"></i> 创建
                        </button>
                        <a href="{{ url_for('wrong.collections') }}" class="btn btn-outline-secondary">
                            取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
