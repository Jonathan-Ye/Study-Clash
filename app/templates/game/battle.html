{% extends "base.html" %}

{% block title %}双人对战 - Study Clash{% endblock %}

{% block content %}
<!-- 意外退出提示条 -->
<div id="return-game-banner" class="alert alert-warning alert-dismissible fade show mb-3" style="display: none;" role="alert">
    <div class="d-flex align-items-center justify-content-between">
        <div>
            <i class="bi bi-exclamation-triangle me-2"></i>
            <strong>您有未完成的游戏</strong>
            <span id="return-game-info" class="ms-2"></span>
        </div>
        <div class="btn-group">
            <button type="button" class="btn btn-sm btn-primary" id="return-game-btn">
                <i class="bi bi-arrow-return-left"></i> 回到游戏
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="dismiss-return-btn">
                <i class="bi bi-x"></i> 忽略
            </button>
        </div>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div class="row">
    <div class="col-12">
        <h3 class="mb-4"><i class="bi bi-people-fill"></i> 双人对战</h3>
        <p class="text-muted">与好友1v1实时对战，一决高下</p>
    </div>
</div>

<div class="row g-4 mb-4">
    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-body text-center">
                <i class="bi bi-plus-circle fs-1 text-success"></i>
                <h5 class="mt-3">创建房间</h5>
                <p class="text-muted">创建新房间，邀请好友加入对战</p>
                <form id="create-room-form">
                    <div class="mb-3">
                        <label class="form-label">选择学科</label>
                        <select class="form-select" id="subject_id" name="subject_id">
                            <option value="">全部学科</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">选择章节</label>
                        <select class="form-select" id="chapter_id" name="chapter_id">
                            <option value="">全部章节</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">难度</label>
                        <select class="form-select" id="difficulty" name="difficulty">
                            <option value="">全部难度</option>
                            <option value="1">简单</option>
                            <option value="2">中等</option>
                            <option value="3">困难</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">题目数量</label>
                        <select class="form-select" id="question_count" name="question_count">
                            <option value="10">10题</option>
                            <option value="15">15题</option>
                            <option value="20">20题</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-plus"></i> 创建房间
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-body text-center">
                <i class="bi bi-box-arrow-in-right fs-1 text-primary"></i>
                <h5 class="mt-3">加入房间</h5>
                <p class="text-muted">输入房间码，加入好友的房间</p>
                <form id="join-room-form">
                    <div class="mb-3">
                        <label class="form-label">房间码</label>
                        <input type="text" class="form-control form-control-lg text-center" 
                               id="room_code" name="room_code" 
                               placeholder="请输入6位房间码" maxlength="6" 
                               style="text-transform: uppercase;">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-arrow-right"></i> 加入房间
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="card mt-4">
    <div class="card-header">
        <h5 class="mb-0"><i class="bi bi-list"></i> 可加入的房间</h5>
    </div>
    <div class="card-body" id="rooms-list">
        <div class="text-center text-muted py-3">加载中...</div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let socket = null;
let roomTimers = {};

function formatTime(seconds) {
    if (seconds <= 0) return '已过期';
    const minutes = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${minutes}:${secs.toString().padStart(2, '0')}`;
}

function updateTimers() {
    Object.keys(roomTimers).forEach(roomCode => {
        if (roomTimers[roomCode] > 0) {
            roomTimers[roomCode]--;
            const timerElement = document.getElementById('timer-' + roomCode);
            if (timerElement) {
                timerElement.textContent = formatTime(roomTimers[roomCode]);
                if (roomTimers[roomCode] <= 60) {
                    timerElement.classList.add('text-danger');
                }
            }
        }
    });
}

setInterval(updateTimers, 1000);

function initSocket() {
    if (socket && socket.connected) {
        console.log('Socket already connected, reusing existing connection');
        return;
    }
    
    socket = io();
    
    socket.on('connect', function() {
        console.log('WebSocket connected');
        socket.emit('get_rooms', {game_type: 'battle'});
    });
    
    socket.on('disconnect', function() {
        console.log('WebSocket disconnected');
    });
    
    socket.on('rooms_list', function(data) {
        const container = document.getElementById('rooms-list');
        container.innerHTML = '';
        roomTimers = {};
        
        if (data.rooms && data.rooms.length > 0) {
            data.rooms.forEach(room => {
                addRoomToList(room);
            });
        } else {
            container.innerHTML = '<div class="text-center text-muted py-3">暂无可加入的房间</div>';
        }
    });
    
    socket.on('room_created', function(data) {
        addRoomToList(data.room);
        
        // 保存房间信息到localStorage，用于意外退出后恢复
        const gameInfo = {
            room_code: data.room.room_code,
            game_type: 'battle',
            timestamp: Date.now()
        };
        localStorage.setItem('pending_game', JSON.stringify(gameInfo));
    });
    
    socket.on('room_updated', function(data) {
        updateRoomInList(data.room);
    });
    
    socket.on('room_removed', function(data) {
        removeRoomFromList(data.room_code);
    });
    
    socket.on('error', function(data) {
        console.error('Socket error:', data.message);
    });
}

function loadRooms() {
    fetch('/game/api/rooms/battle')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('rooms-list');
            container.innerHTML = '';
            roomTimers = {};
            
            if (data.rooms && data.rooms.length > 0) {
                data.rooms.forEach(room => {
                    addRoomToList(room);
                });
            } else {
                container.innerHTML = '<div class="text-center text-muted py-3">暂无可加入的房间</div>';
            }
        });
}

function addRoomToList(room) {
    const container = document.getElementById('rooms-list');
    const noRoomsMsg = container.querySelector('.text-muted');
    if (noRoomsMsg && noRoomsMsg.textContent === '暂无可加入的房间') {
        noRoomsMsg.remove();
    }
    
    roomTimers[room.room_code] = room.remaining_seconds || 0;
    
    const chapterInfo = room.chapter_name ? `<span class="ms-2 text-muted small">${room.chapter_name || ''}</span>` : '';
    const isFull = room.current_players >= room.max_players;
    
    const roomElement = document.createElement('div');
    roomElement.className = 'list-group-item d-flex justify-content-between align-items-center';
    roomElement.id = 'room-' + room.room_code;
    
    // 房间已满时的样式
    const playerBadgeClass = isFull ? 'badge bg-danger ms-2' : 'badge bg-secondary ms-2';
    const joinButtonHtml = isFull 
        ? `<button class="btn btn-sm btn-secondary" disabled>
               <i class="bi bi-lock-fill"></i> 已满
           </button>`
        : `<button class="btn btn-sm btn-primary" onclick="joinRoom('${room.room_code}')">
               加入
           </button>`;
    
    roomElement.innerHTML = `
        <div>
            <span class="badge bg-primary">${room.room_code}</span>
            <span class="ms-2">${room.subject_name || '综合'}</span>
            ${chapterInfo}
            <span class="${playerBadgeClass}">${room.current_players}/${room.max_players}</span>
            <span class="ms-2 text-muted small">
                <i class="bi bi-clock"></i> 
                <span id="timer-${room.room_code}">${formatTime(room.remaining_seconds || 0)}</span>
            </span>
        </div>
        ${joinButtonHtml}
    `;
    
    container.insertBefore(roomElement, container.firstChild);
}

function updateRoomInList(room) {
    const roomElement = document.getElementById('room-' + room.room_code);
    if (roomElement) {
        const isFull = room.current_players >= room.max_players;
        const playerBadgeClass = isFull ? 'badge bg-danger ms-2' : 'badge bg-secondary ms-2';
        
        // 更新玩家数量
        const playersSpan = roomElement.querySelector('.badge.ms-2');
        if (playersSpan) {
            playersSpan.textContent = room.current_players + '/' + room.max_players;
            playersSpan.className = playerBadgeClass;
        }
        
        // 更新按钮状态
        const buttonContainer = roomElement.querySelector('div:last-child');
        if (buttonContainer) {
            if (isFull) {
                buttonContainer.innerHTML = `
                    <button class="btn btn-sm btn-secondary" disabled>
                        <i class="bi bi-lock-fill"></i> 已满
                    </button>
                `;
            } else {
                buttonContainer.innerHTML = `
                    <button class="btn btn-sm btn-primary" onclick="joinRoom('${room.room_code}')">
                        加入
                    </button>
                `;
            }
        }
    }
}

function removeRoomFromList(roomCode) {
    const roomElement = document.getElementById('room-' + roomCode);
    if (roomElement) {
        roomElement.remove();
    }
    
    delete roomTimers[roomCode];
    
    const container = document.getElementById('rooms-list');
    if (container.children.length === 0) {
        container.innerHTML = '<div class="text-center text-muted py-3">暂无可加入的房间</div>';
    }
}

function joinRoom(roomCode) {
    const formData = new FormData();
    formData.append('room_code', roomCode);
    
    fetch('/game/join-room', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.room_code) {
            window.location.href = '/game/room/' + data.room_code;
        } else {
            alert(data.error || '加入失败');
        }
    });
}

document.addEventListener('DOMContentLoaded', function() {
    fetch('/api/subjects')
        .then(response => response.json())
        .then(data => {
            const select = document.getElementById('subject_id');
            data.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject.id;
                option.textContent = subject.name;
                select.appendChild(option);
            });
        });
    
    document.getElementById('subject_id').addEventListener('change', function() {
        const subjectId = this.value;
        const chapterSelect = document.getElementById('chapter_id');
        chapterSelect.innerHTML = '<option value="">全部章节</option>';
        if (subjectId) {
            fetch('/questions/api/chapters/' + subjectId)
                .then(response => response.json())
                .then(data => {
                    data.forEach(chapter => {
                        const option = document.createElement('option');
                        option.value = chapter.id;
                        let displayName = chapter.name;
                        if (chapter.has_children) {
                            displayName = '📁 ' + displayName + ' (包含子章节)';
                        } else if (chapter.level > 1) {
                            displayName = '  ' + '- '.repeat(chapter.level - 1) + displayName;
                        }
                        option.textContent = displayName;
                        chapterSelect.appendChild(option);
                    });
                });
        }
    });
    
    document.getElementById('create-room-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData();
        formData.append('game_type', 'battle');
        formData.append('subject_id', document.getElementById('subject_id').value);
        formData.append('chapter_id', document.getElementById('chapter_id').value);
        formData.append('difficulty', document.getElementById('difficulty').value);
        formData.append('question_count', document.getElementById('question_count').value);
        
        fetch('/game/create-room', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.room_code) {
                window.location.href = '/game/room/' + data.room_code;
            } else {
                alert(data.error || '创建失败');
            }
        });
    });
    
    document.getElementById('join-room-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData();
        formData.append('room_code', document.getElementById('room_code').value);
        
        fetch('/game/join-room', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.room_code) {
                window.location.href = '/game/room/' + data.room_code;
            } else {
                alert(data.error || '加入失败');
            }
        });
    });
    
    initSocket();
    loadRooms();
    
    // 检测未完成的游戏
    const pendingGame = localStorage.getItem('pending_game');
    if (pendingGame) {
        try {
            const gameInfo = JSON.parse(pendingGame);
            // 如果游戏是在30分钟内创建的，显示提示条
            const thirtyMinutesAgo = Date.now() - 30 * 60 * 1000;
            if (gameInfo.timestamp > thirtyMinutesAgo) {
                document.getElementById('return-game-info').textContent = 
                    `房间码: ${gameInfo.room_code}`;
                document.getElementById('return-game-banner').style.display = 'block';
                
                document.getElementById('return-game-btn').onclick = function() {
                    window.location.href = '/game/room/' + gameInfo.room_code;
                };
                
                document.getElementById('dismiss-return-btn').onclick = function() {
                    localStorage.removeItem('pending_game');
                    document.getElementById('return-game-banner').style.display = 'none';
                };
            } else {
                // 超时清理
                localStorage.removeItem('pending_game');
            }
        } catch (e) {
            localStorage.removeItem('pending_game');
        }
    }
});
</script>
{% endblock %}
