<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="legendGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#9400D3;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#800080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B0082;stop-opacity:1" />
    </radialGradient>
    <filter id="legendGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sparkle">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#legendGrad)" stroke="#4B0082" stroke-width="2.5" filter="url(#legendGlow)"/>
  <circle cx="32" cy="32" r="23" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
  <polygon points="32,12 34,22 44,22 36,28 39,38 32,32 25,38 28,28 20,22 30,22" fill="#FFD700" filter="url(#sparkle)"/>
  <circle cx="16" cy="18" r="2" fill="#FFF" opacity="0.8"/>
  <circle cx="48" cy="18" r="2" fill="#FFF" opacity="0.8"/>
  <circle cx="12" cy="42" r="1.5" fill="#FFF" opacity="0.7"/>
  <circle cx="52" cy="42" r="1.5" fill="#FFF" opacity="0.7"/>
  <text x="32" y="57" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFD700" text-anchor="middle">I</text>
</svg>